<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astromaps - Celestial Control Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 500px; }
    /* Invert tile brightness slightly for dark chart aesthetic */
    .leaflet-tile-container { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🌌</span>
      <h1 class="text-xl font-bold tracking-wider text-indigo-400">ASTROMAPS <span class="text-xs text-slate-400 font-normal">v1.1</span></h1>
    </div>
    
    <!-- Real-time Sidereal Status Bar -->
    <div class="hidden md:flex items-center space-x-6 text-sm bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg">
      <div><span class="text-slate-400">GST:</span> <span id="gstVal" class="font-mono text-indigo-300 ml-1">--:--</span></div>
      <div><span class="text-slate-400">LST:</span> <span id="lstVal" class="font-mono text-emerald-400 ml-1">--:--</span></div>
      <div><span class="text-slate-400">Zenith RA:</span> <span id="zenithVal" class="font-mono text-amber-300 ml-1">--:--</span></div>
    </div>

    <!-- User Auth Controls -->
    <div id="authContainer" class="flex items-center space-x-3">
      <button id="openAuthBtn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
        Login / Register
      </button>
      <div id="userInfo" class="hidden flex items-center space-x-3">
        <span id="userGreeting" class="text-sm font-medium text-slate-300"></span>
        <button id="logoutBtn" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Grid -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Left Column: Search & Saved Targets Sidebar -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col space-y-4">
      
      <!-- Tab Controls -->
      <div class="flex border-b border-slate-800 pb-2 space-x-4">
        <button id="tabSearch" type="button" class="text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 pb-1 cursor-pointer">
          Catalog Search
        </button>
        <button id="tabSaved" type="button" class="text-sm font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent pb-1 cursor-pointer">
          Saved Targets (<span id="savedCount">0</span>)
        </button>
      </div>
      
      <!-- Search Panel -->
      <div id="panelSearch" class="flex flex-col space-y-4 flex-1">
        <div class="flex space-x-2">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="e.g., M42, Orion, Andromeda..." 
            class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
          />
          <button id="searchBtn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
            Search
          </button>
        </div>
        <div class="flex-1 overflow-y-auto max-h-[380px] space-y-2" id="resultsList">
          <p class="text-slate-500 text-sm italic">Search for celestial targets to display coordinates...</p>
        </div>
      </div>

      <!-- Saved Targets Panel -->
      <div id="panelSaved" class="hidden flex flex-col space-y-4 flex-1">
        <div class="flex-1 overflow-y-auto max-h-[420px] space-y-2" id="savedList">
          <p class="text-slate-500 text-sm italic">Log in to view your saved targets.</p>
        </div>
      </div>

    </section>

    <!-- Right Column: Interactive Sky Projection Map -->
    <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-200">Sky Chart Projection</h2>
        <span class="text-xs text-slate-400">RA/Dec Map Projection</span>
      </div>
      <div id="map" class="w-full rounded-lg border border-slate-800 overflow-hidden"></div>
    </section>

  </main>

  <!-- Authentication Modal (High z-index to overlay map) -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 relative space-y-5">
      
      <!-- Close Modal Button -->
      <button id="closeAuthModal" type="button" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl cursor-pointer">&times;</button>
      
      <!-- Modal Title -->
      <h2 id="modalTitle" class="text-xl font-bold text-indigo-400">Account Login</h2>

      <!-- Auth Form -->
      <form id="authForm" class="space-y-4">
        <div id="usernameField" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">Username</label>
          <input type="text" id="authUsername" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="e.g. astronomer1">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Email Address</label>
          <input type="email" id="authEmail" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="astro@sky.com">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="••••••••">
        </div>

        <div id="authError" class="text-xs text-rose-400 hidden"></div>

        <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition cursor-pointer">
          Sign In
        </button>
      </form>

      <!-- Toggle Mode -->
      <p class="text-xs text-center text-slate-400">
        <span id="authToggleMsg">Don't have an account?</span>
        <button id="toggleAuthModeBtn" type="button" class="text-indigo-400 font-semibold ml-1 underline cursor-pointer">Register here</button>
      </p>

    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
